name: JS Client E2E

# End-to-end test: the HiveMind-js V1 client this page loads (fetched from the
# same CDN used in production) connects to a real loopback hivemind-core hub,
# performs the password handshake, and exchanges an encrypted utterance.

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  js-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python hub deps
        # Prerelease floors so a plain `pip install` (no --pre, no git branch)
        # resolves the 2.x stack: hivescope>=0.5.1a1 carries the loopback +
        # get_client_by_id fixes (hivescope#26) the hub fixture relies on, and
        # the bus-client floor keeps the whole stack on the 2.x prerelease line.
        run: |
          python -m pip install --upgrade pip
          pip install "hivescope>=0.5.1a1" "hivemind-bus-client>=0.9.2a1" hivemind-core

      - name: Install Node deps
        run: npm install

      - name: Run JS client E2E
        run: npm test
