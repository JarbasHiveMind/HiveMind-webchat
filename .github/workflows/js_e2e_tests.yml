name: JS Client E2E

# End-to-end test: the HiveMind-js V1 client this page loads (fetched from the
# same CDN used in production) connects to a real loopback hivemind-core hub,
# performs the password handshake, and exchanges an encrypted utterance.

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  js-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python hub deps
        # Prerelease floors so a plain `pip install` (no --pre, no git branch)
        # resolves the whole 2.x stack consistently. hivescope>=0.5.1a1 carries
        # the loopback + get_client_by_id fixes (hivescope#26) the hub fixture
        # relies on; hivemind-core>=4.6.7a1 and hivemind-bus-client>=0.9.2a1 are
        # the 2.x line (both on ovos_bus_client>=2.0.0a3). Flooring all three
        # avoids the stable hivemind-core 4.0.0, whose old bus-client pin
        # conflicts with the prerelease bus-client (ResolutionImpossible).
        run: |
          python -m pip install --upgrade pip
          pip install "hivescope>=0.5.1a1" "hivemind-bus-client>=0.9.2a1" "hivemind-core>=4.6.7a1"

      - name: Install Node deps
        run: npm install

      - name: Run JS client E2E
        run: npm test
