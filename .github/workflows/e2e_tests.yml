name: End-to-End Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11"]'
      # The Python e2e suite boots a real hivemind-core master in-process and
      # runs this client's real headless bridge over a real HiveMessageBusClient
      # WebSocket (hivescope loopback); only the browser/websocket frontend
      # surface is mocked. The `e2e` extra pulls the bus-client 2.x stack via
      # pre-release floors (no --pre needed). The browser-side client round-trip
      # is covered separately by js_e2e_tests.yml.
      install_extras: 'e2e'
      test_path: 'tests/e2e/'
